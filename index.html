<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ACE Practice Exam · 600-Question Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E131A;
  --surface:#171D27;
  --surface-2:#1F2733;
  --surface-3:#262F3D;
  --border:#2B3444;
  --border-soft:#232B38;
  --text:#EDF1F6;
  --text-muted:#93A0B4;
  --text-faint:#5E6B80;
  --accent:#33D6AC;
  --accent-dim:#1E7A62;
  --accent-ink:#04140F;
  --warn:#F0A93E;
  --danger:#EF5B5B;
  --danger-dim:#3A1E20;
  --radius:14px;
  --radius-sm:8px;
  --font-display:'Space Grotesk',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(51,214,172,0.08), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(240,169,62,0.05), transparent 55%),
    var(--ink);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:920px;margin:0 auto;padding:28px 20px 60px;min-height:100vh;display:flex;flex-direction:column;}
.brandbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(145deg,var(--accent),var(--accent-dim));display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:600;font-size:13px;color:var(--accent-ink);flex-shrink:0;}
.brand-name{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:0.01em;}
.brand-sub{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);margin-top:1px;}
.top-actions a, .top-actions button.linklike{
  font-family:var(--font-mono);font-size:12px;color:var(--text-muted);background:none;border:none;cursor:pointer;
  text-decoration:none;padding:6px 0;
}
.top-actions button.linklike:hover{color:var(--accent);}

.card{
  background:var(--surface);
  border:1px solid var(--border-soft);
  border-radius:var(--radius);
  padding:32px;
}
.screen{display:flex;flex-direction:column;gap:18px;flex:1;}
.center-screen{flex:1;display:flex;align-items:center;justify-content:center;}
.center-screen .card{max-width:480px;width:100%;}

h1.hero{font-family:var(--font-display);font-size:clamp(28px,4vw,38px);font-weight:700;line-height:1.15;margin:0 0 6px;}
p.lede{color:var(--text-muted);font-size:15px;margin:0 0 8px;max-width:56ch;}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);margin-bottom:4px;}

.stub{
  display:flex;gap:0;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--surface-2);
}
.stub-main{flex:1;padding:22px 24px;}
.stub-tab{
  width:150px;padding:22px 18px;background:var(--surface-3);border-left:1px dashed var(--border);
  display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:6px;
}
.stub-label{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.08em;}
.stub-value{font-family:var(--font-mono);font-size:15px;color:var(--text);font-weight:500;}

.field{display:flex;flex-direction:column;gap:7px;}
.field label{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;}
.field input{
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  font-family:var(--font-mono);font-size:16px;padding:13px 14px;border-radius:var(--radius-sm);
  outline:none;transition:border-color .15s;
}
.field input:focus{border-color:var(--accent);}
.field input::placeholder{color:var(--text-faint);}
.hint{font-size:12.5px;color:var(--text-faint);}
.error-text{font-size:12.5px;color:var(--danger);min-height:16px;}

.btn{
  font-family:var(--font-body);font-weight:600;font-size:14.5px;
  padding:13px 20px;border-radius:var(--radius-sm);border:1px solid transparent;
  cursor:pointer;transition:transform .08s ease, opacity .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--accent);color:var(--accent-ink);}
.btn-primary:hover{opacity:0.92;}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed;}
.btn-ghost{background:transparent;color:var(--text);border-color:var(--border);}
.btn-ghost:hover{border-color:var(--text-muted);}
.btn-danger{background:var(--danger);color:#2A0A0A;}
.btn-block{width:100%;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;}

.choice-tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px;}
.tile{
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);
  padding:22px 18px;cursor:pointer;text-align:left;transition:border-color .15s,background .15s;
  font-family:var(--font-body);color:var(--text);
}
.tile:hover{border-color:var(--accent);background:var(--surface-3);}
.tile .tile-icon{font-family:var(--font-mono);font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:10px;}
.tile .tile-title{font-family:var(--font-display);font-weight:600;font-size:17px;margin-bottom:4px;}
.tile .tile-desc{font-size:13px;color:var(--text-muted);}

.badge{
  font-family:var(--font-mono);font-size:11px;padding:3px 9px;border-radius:100px;
  border:1px solid var(--border);color:var(--text-muted);display:inline-flex;align-items:center;gap:5px;
}
.badge-dot{width:6px;height:6px;border-radius:50%;background:var(--text-faint);}
.badge.ok{color:var(--accent);border-color:var(--accent-dim);}
.badge.ok .badge-dot{background:var(--accent);}
.badge.warn{color:var(--warn);border-color:#5A4420;}
.badge.warn .badge-dot{background:var(--warn);}

.module-list{display:flex;flex-direction:column;gap:10px;margin:6px 0;}
.module-row{
  display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
  background:var(--surface-2);border:1px solid var(--border-soft);border-radius:var(--radius-sm);
}
.module-row .mname{font-size:13.5px;color:var(--text);}
.module-row .mcount{font-family:var(--font-mono);font-size:12px;color:var(--accent);}

/* Exam screen */
.exam-header{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px 18px;background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);
  margin-bottom:16px;position:sticky;top:12px;z-index:5;
}
.exam-id{font-family:var(--font-mono);font-size:12px;color:var(--text-muted);}
.exam-id b{color:var(--text);}
.timer{
  font-family:var(--font-mono);font-size:20px;font-weight:600;color:var(--text);
  padding:6px 14px;border-radius:100px;border:1px solid var(--border);background:var(--surface-2);
  letter-spacing:0.03em;
}
.timer.warn{color:var(--warn);border-color:#5A4420;}
.timer.danger{color:var(--danger);border-color:#5A2323;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.55;}}

.progress-strip{display:flex;gap:3px;margin:2px 0 18px;}
.progress-seg{flex:1;display:flex;gap:2px;}
.progress-dot{flex:1;height:5px;border-radius:2px;background:var(--border);}
.progress-dot.answered{background:var(--accent);}
.progress-dot.current{background:var(--warn);}

.module-tag{font-family:var(--font-mono);font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:10px;}
.qcounter{font-family:var(--font-mono);font-size:12px;color:var(--text-faint);margin-bottom:6px;}
.qtext{font-family:var(--font-display);font-size:20px;font-weight:600;line-height:1.4;margin:0 0 22px;}

.option{
  display:flex;align-items:flex-start;gap:12px;padding:15px 16px;margin-bottom:10px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);
  cursor:pointer;transition:border-color .12s,background .12s;
}
.option:hover{border-color:var(--text-muted);}
.option.selected{border-color:var(--accent);background:rgba(51,214,172,0.08);}
.option .opt-letter{
  font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--text-muted);
  width:24px;height:24px;border-radius:50%;border:1px solid var(--border);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.option.selected .opt-letter{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.option .opt-text{font-size:14.5px;padding-top:2px;}

.exam-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px;}
.jumpgrid{display:grid;grid-template-columns:repeat(15,1fr);gap:5px;margin-top:20px;}
.jumpgrid-wrap{margin-top:26px;padding-top:20px;border-top:1px solid var(--border-soft);}
.jumpgrid-label{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px;}
.jbtn{
  aspect-ratio:1;border-radius:5px;border:1px solid var(--border);background:var(--surface-2);
  font-family:var(--font-mono);font-size:10px;color:var(--text-faint);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.jbtn.answered{background:rgba(51,214,172,0.16);border-color:var(--accent-dim);color:var(--accent);}
.jbtn.current{border-color:var(--warn);color:var(--warn);}

/* Result screen */
.score-hero{text-align:center;padding:36px 20px;}
.score-num{font-family:var(--font-display);font-size:64px;font-weight:700;line-height:1;}
.score-den{font-family:var(--font-mono);font-size:16px;color:var(--text-muted);margin-top:6px;}
.score-pct{font-family:var(--font-mono);font-size:13px;margin-top:12px;}
.pass{color:var(--accent);}
.fail{color:var(--danger);}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px;}
.stat-box{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:14px 16px;}
.stat-box .stat-label{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.06em;}
.stat-box .stat-value{font-family:var(--font-display);font-size:20px;font-weight:600;margin-top:4px;}

/* Admin table */
table.admin-table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px;}
table.admin-table th{
  text-align:left;font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);
  text-transform:uppercase;letter-spacing:0.06em;padding:9px 10px;border-bottom:1px solid var(--border);
}
table.admin-table td{padding:11px 10px;border-bottom:1px solid var(--border-soft);color:var(--text);}
table.admin-table tr:hover td{background:var(--surface-2);}
.mono{font-family:var(--font-mono);}

footer.foot{margin-top:auto;padding-top:36px;text-align:center;font-family:var(--font-mono);font-size:11px;color:var(--text-faint);}

@media (max-width:560px){
  .stub{flex-direction:column;}
  .stub-tab{width:auto;border-left:none;border-top:1px dashed var(--border);}
  .choice-tiles{grid-template-columns:1fr;}
  .jumpgrid{grid-template-columns:repeat(8,1fr);}
  .result-grid{grid-template-columns:1fr;}
  .card{padding:22px;}
  #app{padding:18px 14px 40px;}
}
</style>
</head>

<script>
const QUESTION_BANK = {"Google Cloud Fundamentals":[{"id":"goog-1","module":"Google Cloud Fundamentals","q":"Contoso Health is designing a batch pipeline. The team must keep an application available if one zone fails while retaining low latency within one geographic area. Which solution should the cloud engineer choose?","opts":{"A":"Deploy only in a second project","B":"Use a single global IP without redundant backends","C":"Deploy resources across multiple zones in one region","D":"Deploy all resources in one zone"},"correct":"C"},{"id":"goog-2","module":"Google Cloud Fundamentals","q":"A cloud engineer at Alpine Media receives a requirement to run authenticated Google Cloud CLI commands immediately without installing tools on a local computer. What should the engineer do?","opts":{"A":"Install kubectl in a Cloud Storage bucket","B":"Create a Compute Engine VM only for administration","C":"Use Cloud Shell","D":"Use Cloud Marketplace"},"correct":"C"},{"id":"goog-3","module":"Google Cloud Fundamentals","q":"During a readiness review for a payment service, Fabrikam Finance finds that it still needs to switch safely between two projects while using the CLI. Which action best addresses the requirement?","opts":{"A":"Change the organization policy for each command","B":"Use one service account key for every project","C":"Delete and recreate the projects","D":"Create separate named gcloud configurations"},"correct":"D"},{"id":"goog-4","module":"Google Cloud Fundamentals","q":"Bluebird Logistics wants the most operationally simple Google-recommended approach to place latency-sensitive resources close to users and meet data-location requirements. What should be implemented?","opts":{"A":"Select an appropriate region and verify service availability there","B":"Store all data in Cloud Shell","C":"Use labels to change physical location","D":"Choose any zone because all services are global"},"correct":"A"},{"id":"goog-5","module":"Google Cloud Fundamentals","q":"A migration team is moving a batch pipeline to Google Cloud. It must identify who patches the guest operating system on a standard Compute Engine VM. Which design is most appropriate?","opts":{"A":"The customer patches the guest operating system","B":"The ISP patches the guest OS","C":"Google patches every guest OS automatically in all cases","D":"Cloud DNS patches the guest OS"},"correct":"A"},{"id":"goog-6","module":"Google Cloud Fundamentals","q":"An administrator must keep an application available if one zone fails while retaining low latency within one geographic area while following least privilege and minimizing manual administration. Which option should be selected?","opts":{"A":"Deploy all resources in one zone","B":"Deploy only in a second project","C":"Deploy resources across multiple zones in one region","D":"Use a single global IP without redundant backends"},"correct":"C"},{"id":"goog-7","module":"Google Cloud Fundamentals","q":"A production change for Harbor Energy's media application must switch safely between two projects while using the CLI. Which choice best satisfies the requirement?","opts":{"A":"Use one service account key for every project","B":"Change the organization policy for each command","C":"Create separate named gcloud configurations","D":"Delete and recreate the projects"},"correct":"C"},{"id":"goog-8","module":"Google Cloud Fundamentals","q":"A cloud engineer is troubleshooting a design that does not place latency-sensitive resources close to users and meet data-location requirements. Which corrective action is best?","opts":{"A":"Select an appropriate region and verify service availability there","B":"Use labels to change physical location","C":"Choose any zone because all services are global","D":"Store all data in Cloud Shell"},"correct":"A"},{"id":"goog-9","module":"Google Cloud Fundamentals","q":"Northwind Retail is designing a mobile backend. The team must identify who patches the guest operating system on a standard Compute Engine VM. Which solution should the cloud engineer choose?","opts":{"A":"The customer patches the guest operating system","B":"The ISP patches the guest OS","C":"Google patches every guest OS automatically in all cases","D":"Cloud DNS patches the guest OS"},"correct":"A"},{"id":"goog-10","module":"Google Cloud Fundamentals","q":"A cloud engineer at Contoso Health receives a requirement to keep an application available if one zone fails while retaining low latency within one geographic area. What should the engineer do?","opts":{"A":"Deploy all resources in one zone","B":"Use a single global IP without redundant backends","C":"Deploy resources across multiple zones in one region","D":"Deploy only in a second project"},"correct":"C"},{"id":"goog-11","module":"Google Cloud Fundamentals","q":"During a readiness review for a media application, Alpine Media finds that it still needs to run authenticated Google Cloud CLI commands immediately without installing tools on a local computer. Which action best addresses the requirement?","opts":{"A":"Create a Compute Engine VM only for administration","B":"Use Cloud Shell","C":"Use Cloud Marketplace","D":"Install kubectl in a Cloud Storage bucket"},"correct":"B"},{"id":"goog-12","module":"Google Cloud Fundamentals","q":"Fabrikam Finance wants the most operationally simple Google-recommended approach to switch safely between two projects while using the CLI. What should be implemented?","opts":{"A":"Create separate named gcloud configurations","B":"Change the organization policy for each command","C":"Delete and recreate the projects","D":"Use one service account key for every project"},"correct":"A"},{"id":"goog-13","module":"Google Cloud Fundamentals","q":"An administrator must identify who patches the guest operating system on a standard Compute Engine VM while following least privilege and minimizing manual administration. Which option should be selected?","opts":{"A":"Cloud DNS patches the guest OS","B":"The customer patches the guest operating system","C":"The ISP patches the guest OS","D":"Google patches every guest OS automatically in all cases"},"correct":"B"},{"id":"goog-14","module":"Google Cloud Fundamentals","q":"Which Google Cloud approach is designed to keep an application available if one zone fails while retaining low latency within one geographic area?","opts":{"A":"Deploy only in a second project","B":"Deploy all resources in one zone","C":"Deploy resources across multiple zones in one region","D":"Use a single global IP without redundant backends"},"correct":"C"},{"id":"goog-15","module":"Google Cloud Fundamentals","q":"A production change for Summit Games's batch pipeline must run authenticated Google Cloud CLI commands immediately without installing tools on a local computer. Which choice best satisfies the requirement?","opts":{"A":"Use Cloud Marketplace","B":"Use Cloud Shell","C":"Create a Compute Engine VM only for administration","D":"Install kubectl in a Cloud Storage bucket"},"correct":"B"},{"id":"goog-16","module":"Google Cloud Fundamentals","q":"A cloud engineer is troubleshooting a design that does not switch safely between two projects while using the CLI. Which corrective action is best?","opts":{"A":"Change the organization policy for each command","B":"Create separate named gcloud configurations","C":"Delete and recreate the projects","D":"Use one service account key for every project"},"correct":"B"},{"id":"goog-17","module":"Google Cloud Fundamentals","q":"Vertex Manufacturing is designing a payment service. The team must place latency-sensitive resources close to users and meet data-location requirements. Which solution should the cloud engineer choose?","opts":{"A":"Choose any zone because all services are global","B":"Store all data in Cloud Shell","C":"Use labels to change physical location","D":"Select an appropriate region and verify service availability there"},"correct":"D"},{"id":"goog-18","module":"Google Cloud Fundamentals","q":"A cloud engineer at Northwind Retail receives a requirement to identify who patches the guest operating system on a standard Compute Engine VM. What should the engineer do?","opts":{"A":"The ISP patches the guest OS","B":"Cloud DNS patches the guest OS","C":"The customer patches the guest operating system","D":"Google patches every guest OS automatically in all cases"},"correct":"C"}],"Resource Hierarchy & Project Management":[{"id":"reso-1","module":"Resource Hierarchy & Project Management","q":"A cloud engineer at Fabrikam Finance receives a requirement to use a Google Cloud service that is currently unavailable in a new project. What should the engineer do?","opts":{"A":"Assign the Owner role to all users","B":"Create a second organization","C":"Enable the required service API in the project","D":"Increase a networking quota"},"correct":"C"},{"id":"reso-2","module":"Resource Hierarchy & Project Management","q":"During a readiness review for a research environment, Bluebird Logistics finds that it still needs to prevent projects from creating VM instances with external IP addresses. Which action best addresses the requirement?","opts":{"A":"Use Cloud DNS private zones","B":"Disable Cloud Logging","C":"Apply the relevant organization policy constraint at the appropriate hierarchy level","D":"Create a budget alert"},"correct":"C"},{"id":"reso-3","module":"Resource Hierarchy & Project Management","q":"Cedar Analytics wants the most operationally simple Google-recommended approach to deploy more CPUs after a project reaches its regional CPU limit. What should be implemented?","opts":{"A":"Change the VM labels","B":"Request a quota increase for the required region and metric","C":"Create more IAM roles","D":"Move the project to another billing account without checking quota"},"correct":"B"},{"id":"reso-4","module":"Resource Hierarchy & Project Management","q":"A migration team is moving a internal reporting system to Google Cloud. It must allocate cloud costs among departments using metadata attac /* ===================== STORAGE HELPERS (Firebase Realtime Database) ===================== */
const FB_BASE = (FIREBASE_DB_URL || '').replace(/\/$/, '');

function fbPath(path) {
  return FB_BASE + '/' + path + '.json';
}

async function fbGet(path) {
  try {
    const res = await fetch(fbPath(path));
    if (!res.ok) { state.storageDown = true; return null; }
    state.storageDown = false;
    const data = await res.json();
    return data === null ? null : data;
  } catch (e) {
    state.storageDown = true;
    return null;
  }
}
async function fbPut(path, value) {
  try {
    const res = await fetch(fbPath(path), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(value)
    });
    state.storageDown = !res.ok;
    return res.ok;
  } catch (e) {
    console.error('storage set failed', e);
    state.storageDown = true;
    return false;
  }
}
async function fbDelete(path) {
  try {
    await fetch(fbPath(path), { method: 'DELETE' });
  } catch (e) { /* ignore */ }
}

async function getStudentRecord(roll){
  const data = await fbGet('students/' + encodeURIComponent(roll));
  if (!data) return { roll, attempts: [] };
  return data;
}
async function saveStudentRecord(rec){
  await fbPut('students/' + encodeURIComponent(rec.roll), rec);
}
async function getExamState(roll){
  const data = await fbGet('examstates/' + encodeURIComponent(roll));
  return data || null;
}
async function saveExamState(roll, exam){
  await fbPut('examstates/' + encodeURIComponent(roll), exam);
}
async function clearExamState(roll){
  await fbDelete('examstates/' + encodeURIComponent(roll));
}
async function listAllStudents(){
  const data = await fbGet('students');
  if (!data) return [];
  return Object.values(data);
}

/* ===================== UTIL ===================== */
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function normalizeRoll(v){
  return (v || '').trim().toUpperCase().replace(/\s+/g,'');
}
function fmtTime(totalSec){
  const s = Math.max(0, Math.ceil(totalSec));
  const m = Math.floor(s / 60);
  const ss = s % 60;
  return String(m).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
}
function fmtDate(ts){
  if (!ts) return '—';
  const d = new Date(ts);
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}) + ' ' +
         d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ===================== EXAM BUILD ===================== */
function shuffleOptions(q){
  const letters = ['A','B','C','D'];
  const entries = letters.map(l => ({ text: q.opts[l], wasCorrect: l === q.correct }));
  const shuffled = shuffle(entries);
  const newOpts = {};
  let newCorrect = 'A';
  shuffled.forEach((e, i) => {
    const letter = letters[i];
    newOpts[letter] = e.text;
    if (e.wasCorrect) newCorrect = letter;
  });
  return { ...q, opts: newOpts, correct: newCorrect };
}

function buildExamQuestions(){
  let pool = [];
  MODULE_ORDER.forEach(mod => {
    const picked = shuffle(QUESTION_BANK[mod]).slice(0, QUESTIONS_PER_MODULE[mod]);
    picked.forEach(q => pool.push(shuffleOptions(q)));
  });
  return shuffle(pool);
}

  if (state.screen === 'setup') return renderSetup();
  if (state.screen === 'home') return renderHome();
  if (state.screen === 'student-login') return renderStudentLogin();
  if (state.screen === 'student-gate') return renderStudentGate();
  if (state.screen === 'exam') return renderExam();
  if (state.screen === 'result') return renderResult();
  if (state.screen === 'admin-login') return renderAdminLogin();
  if (state.screen === 'admin-panel') return renderAdminPanel();
}

function shell(inner, opts={}){
  app.innerHTML = `
    <div class="brandbar">
      <div class="brand">
        <div class="brand-mark">CE</div>
        <div>
          <div class="brand-name">ACE Practice Exam &middot; 600-Question Bank</div>
          <div class="brand-sub">Associate Cloud Engineer &middot; Timed Assessment</div>
        </div>
      </div>
      <div class="top-actions">
        ${opts.showHome !== false ? '<button class="linklike" id="nav-home">&larr; Home</button>' : ''}
      </div>
    </div>
    ${state.storageDown ? `<div class="hint" style="color:var(--danger);border:1px solid #5A2323;background:var(--danger-dim);padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:14px;">Couldn't reach the results storage service just now. Your answers are still being kept in this tab, but re-check your connection before submitting.</div>` : ''}
    ${inner}
    <footer class="foot">${TOTAL_QUESTIONS} questions &middot; ${EXAM_DURATION_SEC/60} minutes &middot; ${MODULE_ORDER.length} modules &middot; ${MAX_ATTEMPTS} attempts</footer>
  `;
  const homeBtn = document.getElementById('nav-home');
  if (homeBtn) homeBtn.onclick = () => { stopTimer(); state.screen = 'home'; state.errorMsg=''; render(); };
}

function renderHome(){
  shell(`
    <div class="screen">
      <div class="eyebrow">Google Cloud &middot; Associate Cloud Engineer</div>
      <h1 class="hero">Certification practice exam</h1>
      <p class="lede">A timed ${TOTAL_QUESTIONS}-question assessment pulled at random from ${MODULE_ORDER.length} practice modules spanning all three ACE practice volumes (600 source questions). Each student gets ${MAX_ATTEMPTS} attempts.</p>
      <div class="choice-tiles">
        <div class="tile" id="tile-student">
          <div class="tile-icon">Roll number required</div>
          <div class="tile-title">Take the exam</div>
          <div class="tile-desc">Log in with your roll number to begin or resume your attempt.</div>
        </div>
        <div class="tile" id="tile-admin">
          <div class="tile-icon">Access code required</div>
          <div class="tile-title">Admin dashboard</div>
          <div class="tile-desc">Review every student's scores and export results.</div>
        </div>
      </div>
      <div class="module-list">
        ${MODULE_ORDER.map(m => `
          <div class="module-row">
            <span class="mname">${escapeHtml(m)}</span>
            <span class="mcount">${QUESTIONS_PER_MODULE[m]} of ${QUESTION_BANK[m].length} bits</span>
          </div>
        `).join('')}
      </div>
    </div>
  `, {showHome:false});
  document.getElementById('tile-student').onclick = () => { state.screen='student-login'; state.errorMsg=''; render(); };
  document.getElementById('tile-admin').onclick = () => { state.screen='admin-login'; state.errorMsg=''; render(); };
}

function renderStudentLogin(){
  shell(`
    <div class="center-screen">
      <div class="card">
        <div class="eyebrow">Student sign-in</div>
        <h1 class="hero" style="font-size:26px;">Enter your roll number</h1>
        <p class="lede" style="margin-bottom:18px;">This identifies your attempts. Use the exact roll number your instructor assigned you &mdash; it cannot be changed later.</p>
        <div class="field">
          <label for="roll-input">Roll number</label>
          <input id="roll-input" type="text" placeholder="e.g. CE2026-014" autocomplete="off" autocapitalize="characters" />
        </div>
        <div class="error-text" id="login-error"></div>
        <button class="btn btn-primary btn-block" id="continue-btn" style="margin-top:8px;">Continue</button>
      </div>
    </div>
  `);
  const input = document.getElementById('roll-input');
  input.focus();
  const go = async () => {
    const roll = normalizeRoll(input.value);
    if (!roll){
      document.getElementById('login-error').textContent = 'Please enter your roll number.';
      return;
    }
    state.loading = true;
    document.getElementById('continue-btn').textContent = 'Checking…';
    document.getElementById('continue-btn').disabled = true;
    state.roll = roll;
    const rec = await getStudentRecord(roll);
    state.studentRecord = rec;
    const inProgress = await getExamState(roll);
    if (inProgress) {
      const elapsed = (Date.now() - inProgress.startedAt) / 1000;
      const remaining = inProgress.durationSec - elapsed;
      if (remaining <= 0) {
        await finalizeExam(inProgress, true);
        return;
      }
      state.exam = inProgress;
      state.currentIndex = 0;
      state.screen = 'exam';
      render();
      startTimer();
      return;
    }
    state.screen = 'student-gate';
    render();
  };
  document.getElementById('continue-btn').onclick = go;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}

function renderStudentGate(){
  const rec = state.studentRecord;
  const used = rec.attempts.length;
  const remaining = MAX_ATTEMPTS - used;
  const best = rec.attempts.reduce((m,a) => Math.max(m, a.score), -1);

  let body;
  if (remaining <= 0) {
    body = `
      <div class="eyebrow">Attempts exhausted</div>
      <h1 class="hero" style="font-size:26px;">No attempts remaining</h1>
      <p class="lede">Roll number <b class="mono">${escapeHtml(state.roll)}</b> has already used both attempts.</p>
      <div class="result-grid">
        <div class="stat-box"><div class="stat-label">Best score</div><div class="stat-value">${best}/${TOTAL_QUESTIONS}</div></div>
        <div class="stat-box"><div class="stat-label">Attempts used</div><div class="stat-value">${used}/${MAX_ATTEMPTS}</div></div>
      </div>
      <p class="hint" style="margin-top:18px;">Only your instructor can see the full class results. Contact them if you believe this is an error.</p>
    `;
  } else {
    body = `
      <div class="eyebrow">Attempt ${used + 1} of ${MAX_ATTEMPTS}</div>
      <h1 class="hero" style="font-size:26px;">Ready when you are</h1>
      <p class="lede">Roll number <b class="mono">${escapeHtml(state.roll)}</b>. Review the rules, then begin.</p>
      <div class="stub" style="margin:18px 0;">
        <div class="stub-main">
          <div style="font-size:13.5px;color:var(--text-muted);line-height:1.8;">
            ${TOTAL_QUESTIONS} questions total &middot; randomly drawn across ${MODULE_ORDER.length} modules spanning all 3 volumes<br/>
            ${EXAM_DURATION_SEC/60} minutes on the clock, counting down from the moment you begin<br/>
            The timer keeps running even if you close this tab &mdash; return before it hits zero<br/>
            You will see your final score the instant you submit<br/>
            Only your instructor can see anyone's scores
          </div>
        </div>
        <div class="stub-tab">
          <div class="stub-label">Duration</div>
          <div class="stub-value">${fmtTime(EXAM_DURATION_SEC)}</div>
        </div>
      </div>
      ${used > 0 ? `<p class="hint">Your first attempt scored <b>${rec.attempts[0].score}/${TOTAL_QUESTIONS}</b>.</p>` : ''}
      <button class="btn btn-primary btn-block" id="begin-btn">Begin exam</button>
    `;
  }

  shell(`<div class="screen"><div class="card">${body}</div></div>`);
  const beginBtn = document.getElementById('begin-btn');
  if (beginBtn) beginBtn.onclick = beginExam;
}

async function beginExam(){
  const rec = state.studentRecord;
  const attemptNo = rec.attempts.length + 1;
  const questions = buildExamQuestions();
  const exam = {
    roll: state.roll,
    attemptNo,
    startedAt: Date.now(),
    durationSec: EXAM_DURATION_SEC,
    questions,
    answers: {}
  };
  state.exam = exam;
  state.currentIndex = 0;
  await saveExamState(state.roll, exam);
  state.screen = 'exam';
  render();
  startTimer();
}

function renderExam(){
  const exam = state.exam;
  const q = exam.questions[state.currentIndex];
  const answeredCount = Object.keys(exam.answers).length;
  const remaining = exam.durationSec - (Date.now() - exam.startedAt) / 1000;

  const segHtml = MODULE_ORDER.map((mod) => {
    const dots = exam.questions
      .map((qq, i) => ({qq, i}))
      .filter(x => x.qq.module === mod)
      .map(x => {
        let cls = 'progress-dot';
        if (x.i === state.currentIndex) cls += ' current';
        else if (exam.answers[x.qq.id]) cls += ' answered';
        return `<div class="${cls}"></div>`;
      }).join('');
    return `<div class="progress-seg">${dots}</div>`;
  }).join('');

  const optionsHtml = ['A','B','C','D'].map(letter => {
    const selected = exam.answers[q.id] === letter;
    return `
      <div class="option ${selected ? 'selected' : ''}" data-letter="${letter}">
        <div class="opt-letter">${letter}</div>
        <div class="opt-text">${escapeHtml(q.opts[letter])}</div>
      </div>
    `;
  }).join('');

  const jumpHtml = exam.questions.map((qq, i) => {
    let cls = 'jbtn';
    if (i === state.currentIndex) cls += ' current';
    else if (exam.answers[qq.id]) cls += ' answered';
    return `<button class="${cls}" data-jump="${i}">${i+1}</button>`;
  }).join('');

  shell(`
    <div class="exam-header">
      <div class="exam-id">Roll <b>${escapeHtml(exam.roll)}</b> &middot; Attempt ${exam.attemptNo}/${MAX_ATTEMPTS} &middot; ${answeredCount}/${TOTAL_QUESTIONS} answered</div>
      <div class="timer" id="timer-display">${fmtTime(remaining)}</div>
    </div>
    <div class="progress-strip">${segHtml}</div>
    <div class="card">
      <div class="module-tag">${escapeHtml(q.module)}</div>
      <div class="qcounter">Question ${state.currentIndex + 1} of ${TOTAL_QUESTIONS}</div>
      <div class="qtext">${escapeHtml(q.q)}</div>
      <div class="options">${optionsHtml}</div>
      <div class="exam-nav">
        <button class="btn btn-ghost" id="prev-btn" ${state.currentIndex === 0 ? 'disabled' : ''}>&larr; Previous</button>
        <div class="btn-row">
          ${state.currentIndex === exam.questions.length - 1
            ? `<button class="btn btn-primary" id="submit-btn">Submit exam</button>`
            : `<button class="btn btn-primary" id="next-btn">Next &rarr;</button>`}
        </div>
      </div>
      <div class="jumpgrid-wrap">
        <div class="jumpgrid-label">Jump to question</div>
        <div class="jumpgrid">${jumpHtml}</div>
      </div>
      <div style="text-align:right;margin-top:18px;">
        <button class="btn btn-ghost" id="submit-early-btn" style="font-size:12.5px;padding:8px 14px;">Submit now</button>
      </div>
    </div>
  `, {showHome:false});

  document.querySelectorAll('.option').forEach(el => {
    el.onclick = () => selectAnswer(q.id, el.getAttribute('data-letter'));
  });
  document.querySelectorAll('[data-jump]').forEach(el => {
    el.onclick = () => { state.currentIndex = parseInt(el.getAttribute('data-jump'), 10); render(); };
  });
  const prevBtn = document.getElementById('prev-btn');
  if (prevBtn) prevBtn.onclick = () => { state.currentIndex--; render(); };
  const nextBtn = document.getElementById('next-btn');
  if (nextBtn) nextBtn.onclick = () => { state.currentIndex++; render(); };
  const submitBtn = document.getElementById('submit-btn');
  if (submitBtn) submitBtn.onclick = () => confirmSubmit();
  const submitEarlyBtn = document.getElementById('submit-early-btn');
  if (submitEarlyBtn) submitEarlyBtn.onclick = () => confirmSubmit();
}

function selectAnswer(qId, letter){
  state.exam.answers[qId] = letter;
  saveExamState(state.roll, state.exam);
  render();
}

function confirmSubmit(){
  const exam = state.exam;
  const unanswered = TOTAL_QUESTIONS - Object.keys(exam.answers).length;
  const msg = unanswered > 0
    ? `You have ${unanswered} unanswered question${unanswered===1?'':'s'}. Submit anyway?`
    : `Submit your exam? You won't be able to change answers after this.`;
  if (window.confirm(msg)) {
    finalizeExam(exam, false);
  }
}

async function finalizeExam(exam, autoSubmitted){
  stopTimer();
  let score = 0;
  exam.questions.forEach(q => {
    if (exam.answers[q.id] === q.correct) score++;
  });
  const rec = await getStudentRecord(exam.roll);
  const attemptRecord = {
    attemptNo: exam.attemptNo,
    score,
    total: TOTAL_QUESTIONS,
    startedAt: exam.startedAt,
    submittedAt: Date.now(),
    autoSubmitted
  };
  rec.attempts.push(attemptRecord);
  rec.roll = exam.roll;
  await saveStudentRecord(rec);
  await clearExamState(exam.roll);

  state.studentRecord = rec;
  state.lastResult = attemptRecord;
  state.exam = null;
  state.screen = 'result';
  render();
}

function renderResult(){
  const r = state.lastResult;
  const pct = Math.round((r.score / r.total) * 100);
  const passed = pct >= PASS_THRESHOLD_PCT;
  const rec = state.studentRecord;
  const remaining = MAX_ATTEMPTS - rec.attempts.length;

  shell(`
    <div class="screen">
      <div class="card">
        <div class="eyebrow">${r.autoSubmitted ? 'Time expired &middot; auto-submitted' : 'Submitted'}</div>
        <div class="score-hero">
          <div class="score-num" style="color:${passed ? 'var(--accent)' : 'var(--danger)'}">${r.score}</div>
          <div class="score-den">out of ${r.total} &middot; attempt ${r.attemptNo} of ${MAX_ATTEMPTS}</div>
          <div class="score-pct ${passed ? 'pass' : 'fail'}">${pct}% &middot; ${passed ? 'Above' : 'Below'} the ${PASS_THRESHOLD_PCT}% practice benchmark</div>
        </div>
        <div class="result-grid">
          <div class="stat-box"><div class="stat-label">Roll number</div><div class="stat-value mono" style="font-size:16px;">${escapeHtml(state.roll)}</div></div>
          <div class="stat-box"><div class="stat-label">Attempts remaining</div><div class="stat-value">${remaining}</div></div>
        </div>
        <p class="hint" style="margin-top:20px;">Your score has been recorded. Only your instructor can view scores across the class &mdash; you won't see anyone else's, and no one else will see yours.</p>
        <div class="btn-row" style="margin-top:14px;">
          <button class="btn btn-ghost" id="done-btn">Done</button>
        </div>
      </div>
    </div>
  `, {showHome:false});
  document.getElementById('done-btn').onclick = () => { state.screen = 'home'; render(); };
}

/* ===================== ADMIN ===================== */
function renderAdminLogin(){
  shell(`
    <div class="center-screen">
      <div class="card">
        <div class="eyebrow">Instructor access</div>
        <h1 class="hero" style="font-size:26px;">Admin dashboard</h1>
        <p class="lede" style="margin-bottom:18px;">Enter the access code to view every student's attempts and export results.</p>
        <div class="field">
          <label for="admin-input">Access code</label>
          <input id="admin-input" type="password" placeholder="Access code" autocomplete="off" />
        </div>
        <div class="error-text" id="admin-error"></div>
        <button class="btn btn-primary btn-block" id="admin-continue-btn" style="margin-top:8px;">Enter dashboard</button>
      </div>
    </div>
  `);
  const input = document.getElementById('admin-input');
  input.focus();
  const go = async () => {
    if (input.value !== ADMIN_CODE) {
      document.getElementById('admin-error').textContent = 'Incorrect access code.';
      return;
    }
    document.getElementById('admin-continue-btn').textContent = 'Loading…';
    document.getElementById('admin-continue-btn').disabled = true;
    await loadAdminData();
    state.screen = 'admin-panel';
    render();
  };
  document.getElementById('admin-continue-btn').onclick = go;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}

async function loadAdminData(){
  const records = await listAllStudents();
  records.sort((a,b) => (a.roll || '').localeCompare(b.roll || ''));
  state.adminData = records;
}

function renderAdminPanel(){
  const records = state.adminData || [];
  const rows = records.map(rec => {
    const a1 = rec.attempts[0];
    const a2 = rec.attempts[1];
    const best = rec.attempts.reduce((m,a) => Math.max(m, a.score), 0);
    const last = rec.attempts.length ? rec.attempts[rec.attempts.length - 1].submittedAt : null;
    return `
      <tr>
        <td class="mono">${escapeHtml(rec.roll)}</td>
        <td>${a1 ? a1.score + '/' + a1.total : '—'}${a1 && a1.autoSubmitted ? ' <span class="hint">(auto)</span>' : ''}</td>
        <td>${a2 ? a2.score + '/' + a2.total : '—'}${a2 && a2.autoSubmitted ? ' <span class="hint">(auto)</span>' : ''}</td>
        <td><b>${rec.attempts.length ? best + '/' + rec.attempts[0].total : '—'}</b></td>
        <td>${rec.attempts.length}/${MAX_ATTEMPTS}</td>
        <td class="mono" style="font-size:11.5px;color:var(--text-muted);">${fmtDate(last)}</td>
      </tr>
    `;
  }).join('');

  const totalStudents = records.length;
  const completedBoth = records.filter(r => r.attempts.length >= MAX_ATTEMPTS).length;
  const avgBest = totalStudents ? Math.round(records.reduce((s,r) => s + Math.max(0,...r.attempts.map(a=>a.score),0), 0) / totalStudents) : 0;

  shell(`
    <div class="screen">
      <div class="eyebrow">Instructor dashboard</div>
      <h1 class="hero" style="font-size:26px;">All student results</h1>
      <div class="result-grid" style="grid-template-columns:1fr 1fr 1fr;">
        <div class="stat-box"><div class="stat-label">Students</div><div class="stat-value">${totalStudents}</div></div>
        <div class="stat-box"><div class="stat-label">Used both attempts</div><div class="stat-value">${completedBoth}</div></div>
        <div class="stat-box"><div class="stat-label">Avg. best score</div><div class="stat-value">${avgBest}/${TOTAL_QUESTIONS}</div></div>
      </div>
      <div class="card" style="padding:20px 22px;">
        <div class="btn-row" style="justify-content:space-between;margin-bottom:6px;">
          <div class="hint">${totalStudents} record${totalStudents===1?'':'s'} loaded</div>
          <div class="btn-row">
            <button class="btn btn-ghost" id="refresh-btn" style="font-size:12.5px;padding:9px 14px;">Refresh</button>
            <button class="btn btn-primary" id="download-btn" style="font-size:12.5px;padding:9px 14px;">Download CSV</button>
          </div>
        </div>
        ${totalStudents === 0 ? `<p class="hint" style="margin-top:14px;">No students have started the exam yet.</p>` : `
        <div style="overflow-x:auto;">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Roll number</th><th>Attempt 1</th><th>Attempt 2</th><th>Best</th><th>Attempts used</th><th>Last submitted</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        `}
      </div>
    </div>
  `);
  document.getElementById('refresh-btn').onclick = async () => {
    document.getElementById('refresh-btn').textContent = 'Refreshing…';
    await loadAdminData();
    render();
  };
  document.getElementById('download-btn').onclick = downloadCsv;
}

function downloadCsv(){
  const records = state.adminData || [];
  const header = ['Roll Number','Attempt 1 Score','Attempt 1 Total','Attempt 1 Auto-Submitted','Attempt 1 Submitted At',
                   'Attempt 2 Score','Attempt 2 Total','Attempt 2 Auto-Submitted','Attempt 2 Submitted At','Best Score','Attempts Used'];
  const lines = [header.join(',')];
  records.forEach(rec => {
    const a1 = rec.attempts[0];
    const a2 = rec.attempts[1];
    const best = rec.attempts.reduce((m,a) => Math.max(m, a.score), 0);
    const row = [
      rec.roll,
      a1 ? a1.score : '', a1 ? a1.total : '', a1 ? a1.autoSubmitted : '', a1 ? new Date(a1.submittedAt).toISOString() : '',
      a2 ? a2.score : '', a2 ? a2.total : '', a2 ? a2.autoSubmitted : '', a2 ? new Date(a2.submittedAt).toISOString() : '',
      rec.attempts.length ? best : '',
      rec.attempts.length
    ];
    lines.push(row.map(v => `"${String(v).replace(/"/g,'""')}"`).join(','));
  });
  const csv = lines.join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'ace_exam_results_' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ===================== TIMER ===================== */
function startTimer(){
  stopTimer();
  timerHandle = setInterval(() => {
    if (!state.exam || state.screen !== 'exam') { stopTimer(); return; }
    const remaining = state.exam.durationSec - (Date.now() - state.exam.startedAt) / 1000;
    const el = document.getElementById('timer-display');
    if (el) {
      el.textContent = fmtTime(remaining);
      el.className = 'timer' + (remaining <= 60 ? ' danger' : remaining <= 300 ? ' warn' : '');
    }
    if (remaining <= 0) {
      stopTimer();
      finalizeExam(state.exam, true);
    }
  }, 1000);
}
function stopTimer(){
  if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
}

/* ===================== INIT ===================== */
if (FIREBASE_DB_URL === 'REPLACE_ME') {
  state.screen = 'setup';
}
render();


</script>
